name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect application changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # PR checkout is the merge commit; its first parent is the tested base.
          # Unknown files and unavailable diffs conservatively run all checks.
          if [ "$EVENT_NAME" = "push" ] || ! git diff --quiet HEAD^ HEAD -- . ':(exclude)docs/**' ':(glob,exclude)**/*.md' ':(exclude)LICENSE'; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.app == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: npm ci

      - name: Run tests
        if: steps.changes.outputs.app == 'true'
        run: npm test -- --run

      - name: Run linter
        if: steps.changes.outputs.app == 'true'
        run: npm run lint

      # build already runs tsc -b; a separate typecheck repeats that work.
      - name: Build for production
        if: steps.changes.outputs.app == 'true'
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /math-worksheet/

      - name: Install Playwright headless Chromium
        if: github.event_name == 'pull_request' && steps.changes.outputs.app == 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Start preview server
        if: github.event_name == 'pull_request' && steps.changes.outputs.app == 'true'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/math-worksheet-preview.log 2>&1 &
          npx wait-on http://127.0.0.1:4173/math-worksheet/ --timeout 30000

      - name: Check print layout and PDF output
        if: github.event_name == 'pull_request' && steps.changes.outputs.app == 'true'
        run: |
          npm run check:layout -- http://127.0.0.1:4173/math-worksheet/
          npm run check:curriculum -- http://127.0.0.1:4173/math-worksheet/ --print-only

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
